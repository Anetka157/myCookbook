<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar *ngIf="!isOnline" class="offline-toolbar">
    <div class="offline-text">
      Pracujete v offline režimu (data se načítají z paměti)
    </div>
  </ion-toolbar>

  <ion-toolbar>
    <div class="header-row-container">
      <div class="header-content-main">
        <h1 *ngIf="displayName">Ahoj, {{ displayName }}</h1>
        <h1 *ngIf="!displayName">Ahoj...</h1>
        <p>Co si dnes uvaříme?</p>
      </div>

      <div class="avatar-circle">
        <ion-icon name="restaurant-outline"></ion-icon>
      </div>
    </div>
  </ion-toolbar>

  <ion-toolbar>
    <div class="search-and-filter-container">
      <div class="custom-search-wrapper">
        <ion-icon name="search-outline"></ion-icon>

        <input
          type="text"
          [(ngModel)]="searchTerm"
          (input)="handleSearch()"
          placeholder="Hledat recept..."
        />

        <!-- Přesunuto do vlastního klikacího kontejneru vedle inputu -->
        <div
          *ngIf="searchTerm && searchTerm.length > 0"
          class="clear-icon-container"
          (click)="clearSearch(); $event.stopPropagation()">
          <ion-icon name="close-circle-outline" class="clear-icon"></ion-icon>
        </div>
      </div>

      <div class="filter-btn-new" (click)="openFilter()">
        <ion-icon name="options-outline"></ion-icon>
      </div>
    </div>

    <div class="active-filters-container" *ngIf="hasActiveFilters()">
      <div *ngFor="let key of getActiveFiltersKeys()" class="filter-chip">
        <span>{{ getFilterLabel(key) }}</span>
        <ion-icon name="close-circle-outline" (click)="removeFilter(key)"></ion-icon>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="recipes-grid">
    <div class="recipe-item" *ngFor="let recipe of recipes; trackBy: trackByFn">
      <div class="image-container" [routerLink]="['/recipe-detail', recipe.id]">
        <img [src]="recipe.image" alt="{{ recipe.title }}" />
        <div class="heart-badge">
          <ion-button fill="clear" (click)="toggleFavorite(recipe); $event.stopPropagation()">
            <ion-icon
              slot="icon-only"
              [name]="isFavorite(recipe.id) ? 'heart' : 'heart-outline'"
              [color]="isFavorite(recipe.id) ? 'danger' : 'medium'">
            </ion-icon>
          </ion-button>
        </div>
      </div>

      <div class="recipe-details" [routerLink]="['/recipe-detail', recipe.id]">
        <h3>{{ recipe.title }}</h3>
        <div class="meta-row">
          <div class="time-info">
            <ion-icon name="time-outline"></ion-icon>
            <span>{{ recipe.readyInMinutes }} min</span>
          </div>
          <div class="level-info">
            <span>{{ recipe.difficulty }} lvl</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading && recipes.length < totalRecipes" class="load-more-container">
    <ion-button (click)="loadMoreRecipes()" fill="outline" color="warning" class="load-more-btn">
      Načíst další recepty
    </ion-button>
  </div>

  <div class="custom-loader-overlay" *ngIf="isLoading && recipes.length < totalRecipes">
    <ion-spinner name="bubbles" color="warning"></ion-spinner>
  </div>

  <div *ngIf="recipes.length >= totalRecipes && totalRecipes > 0" class="footer-text">
    To je vše, co jsme v kuchařce našli 🍳
  </div>

</ion-content>
