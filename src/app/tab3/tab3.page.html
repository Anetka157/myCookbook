<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar *ngIf="!isOnline" class="offline-toolbar">
    <div class="offline-text">
      Pracujete v offline režimu (data se načítají z paměti)
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="profile-header" [class.is-offline]="!isOnline">
    <div class="avatar-circle">
      <ion-icon name="person"></ion-icon>
    </div>
    <h2>{{ user?.displayName || 'Anetka' }}</h2>
    <p>{{ user?.email }}</p>
  </div>

  <div class="settings-container">
    <h3 class="section-title">Nastavení aplikace</h3>

    <div class="custom-settings-list">

      <div class="settings-card">
        <ion-icon name="notifications-outline"></ion-icon>
        <span class="card-label">Upozornění</span>
        <ion-toggle
          [checked]="notificationsEnabled"
          (ionChange)="toggleNotifications($event)">
        </ion-toggle>
      </div>

      <div class="settings-card">
        <ion-icon name="color-palette-outline"></ion-icon>
        <span class="card-label">Tmavý režim</span>
        <ion-toggle [checked]="isDarkMode" (ionChange)="toggleTheme($event)"></ion-toggle>
      </div>

      <div class="settings-card is-clickable" (click)="showPrivacyPolicy()">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
        <span class="card-label">Ochrana údajů</span>
        <!-- Tady přidáme tu malou šipku doprava, co tam byla nativně -->
        <ion-icon name="chevron-forward-outline" class="arrow-forward"></ion-icon>
      </div>

    </div>

    <div class="logout-wrapper">
      <ion-button (click)="logout()" expand="block" fill="clear" class="logout-btn">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        Odhlásit se
      </ion-button>
    </div>
  </div>
</ion-content>
